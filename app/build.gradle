plugins { id 'com.android.application' }

android {
    namespace 'ar.mesa.pokemontcg'
    compileSdk 34

    defaultConfig {
        applicationId 'ar.mesa.pokemontcg'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
